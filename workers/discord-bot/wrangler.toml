# Discord bot — a separate Worker that shares the site's D1 databases.
#
# Always pass `--env dev|staging|production`. The top level only holds what every environment
# shares. Named environments do **not** inherit bindings, vars or triggers, so each `[env.*]`
# block declares them in full (same rule as the site's wrangler.toml).
#
# Migrations live in the site's Prisma setup (`prisma/migrations`). This Worker never applies
# them, so no `migrations_dir` here.
#
# The ID vars are placeholders. The deployment ticket fills them in. They are public values
# (application ID and public key are shown to anyone who installs the app), so they live here and
# not in secrets. The only secret is DISCORD_BOT_TOKEN.

main = "src/index.ts"
name = "townofus-discord-bot-dev"
compatibility_date = "2026-05-01"
account_id = "d1287f321cc95882fc773ab71241b51a"
workers_dev = false

# --------------------------------------------------------------------------------------------
# dev — local only (`npm run dev`). Never deployed. Uses the dev Discord application.
# --------------------------------------------------------------------------------------------
[env.dev]
name = "townofus-discord-bot-dev"
workers_dev = false

[env.dev.secrets]
required = ["DISCORD_BOT_TOKEN"]

[env.dev.triggers]
crons = ["*/10 15-22 * * WED"]

# Same block as the site's top level, so `--persist-to ../../.wrangler/state` reads the site's
# local D1 file.
[[env.dev.d1_databases]]
binding = "DB"
database_name = "townofus-pl"
database_id = "0edadde7-395f-4e3c-a69d-7d40ece774ad"
preview_database_id = "44f0d77c-c0b4-43d1-b3a3-7777be86d5d6"

[env.dev.vars]
DISCORD_APPLICATION_ID = ""
DISCORD_PUBLIC_KEY = ""
DISCORD_GUILD_ID = ""
DISCORD_CHANNEL_ID = ""
DISCORD_HOST_ROLE_ID = ""
TEXT_POLL_QUESTION = "KTO ZOSTANIE EMPEROREM PO DZISIEJSZEJ SESJI?"
TEXT_SIGNUP = "Kto gra w środę {date}? Kliknij Gram."
TEXT_SIGNUP_CLOSED = "Zapisy zamknięte"
TEXT_SIGNUP_CLOSED_REPLY = "Zapisy zamknięte, napisz do hosta"

# --------------------------------------------------------------------------------------------
# staging — staging Discord application, production server, test channel
# --------------------------------------------------------------------------------------------
[env.staging]
name = "townofus-discord-bot-staging"
# Discord needs a public HTTPS URL for the interactions endpoint.
workers_dev = true
preview_urls = false

# Enforced by wrangler: a deploy is refused if the secret is unset.
[env.staging.secrets]
required = ["DISCORD_BOT_TOKEN"]

# UTC. Covers 17:00, 18:00 and 22:00-23:59 Europe/Warsaw in summer and winter time. The code
# picks the step from the local time (src/schedule.ts).
[env.staging.triggers]
crons = ["*/10 15-22 * * WED"]

[env.staging.observability]
enabled = true

[[env.staging.d1_databases]]
binding = "DB"
database_name = "townofus_pl_preview"
database_id = "44f0d77c-c0b4-43d1-b3a3-7777be86d5d6"

[env.staging.vars]
DISCORD_APPLICATION_ID = ""
DISCORD_PUBLIC_KEY = ""
DISCORD_GUILD_ID = ""
DISCORD_CHANNEL_ID = ""
DISCORD_HOST_ROLE_ID = ""
TEXT_POLL_QUESTION = "KTO ZOSTANIE EMPEROREM PO DZISIEJSZEJ SESJI?"
TEXT_SIGNUP = "Kto gra w środę {date}? Kliknij Gram."
TEXT_SIGNUP_CLOSED = "Zapisy zamknięte"
TEXT_SIGNUP_CLOSED_REPLY = "Zapisy zamknięte, napisz do hosta"

# --------------------------------------------------------------------------------------------
# production — prod Discord application, production server, production channel
# --------------------------------------------------------------------------------------------
[env.production]
name = "townofus-discord-bot"
workers_dev = true
preview_urls = false

[env.production.secrets]
required = ["DISCORD_BOT_TOKEN"]

[env.production.triggers]
crons = ["*/10 15-22 * * WED"]

[env.production.observability]
enabled = true

[[env.production.d1_databases]]
binding = "DB"
database_name = "townofus-pl"
database_id = "0edadde7-395f-4e3c-a69d-7d40ece774ad"

[env.production.vars]
DISCORD_APPLICATION_ID = ""
DISCORD_PUBLIC_KEY = ""
DISCORD_GUILD_ID = ""
DISCORD_CHANNEL_ID = ""
DISCORD_HOST_ROLE_ID = ""
TEXT_POLL_QUESTION = "KTO ZOSTANIE EMPEROREM PO DZISIEJSZEJ SESJI?"
TEXT_SIGNUP = "Kto gra w środę {date}? Kliknij Gram."
TEXT_SIGNUP_CLOSED = "Zapisy zamknięte"
TEXT_SIGNUP_CLOSED_REPLY = "Zapisy zamknięte, napisz do hosta"
