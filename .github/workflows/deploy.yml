name: Deploy

# Push to main deploys to **staging**. Production is manual only.
#
# This is a deliberate change: merging to main used to be a production release,
# with no typecheck and no tests in front of it.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment target'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  check:
    uses: ./.github/workflows/check.yml

  deploy:
    needs: check
    runs-on: ubuntu-latest

    # A push is always staging; only an explicit dispatch can pick production.
    environment: ${{ github.event_name == 'push' && 'staging' || inputs.environment }}

    env:
      HUSKY: 0
      TARGET: ${{ github.event_name == 'push' && 'staging' || inputs.environment }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d1287f321cc95882fc773ab71241b51a

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - run: npm ci

      # Migrations gate the rollout: if this fails the job fails and no code
      # ships against a half-migrated database. That matters for any migration
      # that is not purely additive — #302 renames a column.
      - name: Apply database migrations (${{ env.TARGET }})
        run: npm run db:migrate:apply:${{ env.TARGET }}

      - name: Build and deploy (${{ env.TARGET }})
        run: |
          if [ "$TARGET" = "production" ]; then
            npm run deploy
          else
            npm run deploy:staging
          fi
