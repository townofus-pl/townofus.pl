name: Discord bot

# The bot Worker in workers/discord-bot/. Separate from the site's check.yml / deploy.yml.
#
#   pull request touching the bot  -> test
#   push to main touching the bot  -> test, deploy to staging
#   workflow_dispatch              -> test, then deploy or register commands in the chosen env
on:
  pull_request:
    branches:
      - main
    # The bot uses the root's dependencies, so a root dependency bump must run its checks too.
    paths:
      - 'workers/discord-bot/**'
      - '.github/workflows/discord-bot.yml'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches:
      - main
    paths:
      - 'workers/discord-bot/**'
      - '.github/workflows/discord-bot.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      action:
        description: 'What to do'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - register-commands

defaults:
  run:
    working-directory: workers/discord-bot

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # The bot uses the root's dependencies (wrangler, jest, typescript). It has no lockfile.
      # No install scripts: the bot needs neither the site's Prisma client nor its typegen.
      - run: npm ci --ignore-scripts
        working-directory: .

      - run: npm run typecheck

      - run: npm test

      # Bundles and validates both environments' config without uploading.
      - run: npm run dry-run

  deploy:
    needs: test
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy')
    runs-on: ubuntu-latest

    # A push is always staging. Only an explicit dispatch can pick production.
    environment: ${{ github.event_name == 'push' && 'staging' || inputs.environment }}
    concurrency: discord-bot-deploy-${{ github.event_name == 'push' && 'staging' || inputs.environment }}

    env:
      TARGET: ${{ github.event_name == 'push' && 'staging' || inputs.environment }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d1287f321cc95882fc773ab71241b51a
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}

    steps:
      # workflow_dispatch can start from any branch. Production gets only the code on main.
      - name: Production only from main
        if: env.TARGET == 'production' && github.ref != 'refs/heads/main'
        working-directory: .
        run: |
          echo "::error::Production deploy runs only from main. This run is on $GITHUB_REF. Start the workflow from main."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci --ignore-scripts
        working-directory: .

      # The token goes up with the deploy itself (--secrets-file), so the Worker never runs a
      # version without it. The file lives in the runner's temp dir and is deleted afterwards.
      #
      # Without the token a push to main skips the deploy with a warning, so the workflow stays
      # green until the secret exists (#361). A manual dispatch still fails.
      - name: Deploy (${{ env.TARGET }})
        run: |
          if [ -z "$DISCORD_BOT_TOKEN" ]; then
            message="DISCORD_BOT_TOKEN is not set in the '$TARGET' GitHub environment"
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo "::warning::$message. Deploy skipped."
              echo "Deploy skipped: $message." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error::$message"
            exit 1
          fi
          secrets_file="$RUNNER_TEMP/discord-bot-secrets.json"
          jq -n --arg token "$DISCORD_BOT_TOKEN" '{DISCORD_BOT_TOKEN: $token}' > "$secrets_file"
          trap 'rm -f "$secrets_file"' EXIT
          npx wrangler deploy --env "$TARGET" --secrets-file "$secrets_file"

  register-commands:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'register-commands'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}

    steps:
      - name: Production only from main
        if: inputs.environment == 'production' && github.ref != 'refs/heads/main'
        working-directory: .
        run: |
          echo "::error::Production command registration runs only from main. This run is on $GITHUB_REF. Start the workflow from main."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci --ignore-scripts
        working-directory: .

      - run: npm run register-commands -- --env "${{ inputs.environment }}"
