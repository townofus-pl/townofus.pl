name: Check

# Reusable gate. Every deploy job `needs:` this, so nothing ships that does not
# typecheck and pass its tests.
on:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # `npm ci` triggers `prepare`, which runs husky. There are no git hooks to
      # install in CI and husky exits non-zero when it cannot find a .git dir.
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # `prepare` also runs cf-typegen and prisma generate, both of which the
      # typecheck depends on. Neither needs Cloudflare credentials.
      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # The manifest's hashes must match the files served beside it. A mismatch makes every
      # player's auto-update fail silently, visible only in their own log.
      - run: npm run mod:publish

  # The Workers under workers/: the Discord bot and the weekly D1 snapshot. Each has its own
  # tsconfig and Jest config and uses the root's dependencies. The snapshot dry run pins wrangler
  # 4.157.0 through npx (the root has an older one).
  worker:
    name: worker (${{ matrix.worker }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        worker: [discord-bot, db-snapshot]
    env:
      HUSKY: 0
    defaults:
      run:
        working-directory: workers/${{ matrix.worker }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # A full `npm ci`, with install scripts, the same as the site's job. Tests that use
      # Miniflare need the workerd binary in place.
      - run: npm ci
        working-directory: .

      # worker-configuration.d.ts is generated from wrangler.toml and committed. Fails when it is stale.
      - name: Check generated types
        if: matrix.worker == 'db-snapshot'
        run: npm run types:check

      - run: npm run typecheck

      - run: npm test

      # Bundles and validates the staging and production config without uploading.
      - run: npm run dry-run
